name: "The Whispering Forest"
type: area
tags: [forest, dangerous, magical]
description: |
  The trees here are ancient, their bark gnarled and silver-grey. A hush
  hangs over the path, broken only by the rustle of leaves that seem to
  form half-heard words. Travelers often feel watched, though no eyes are
  ever seen.
variants:
  morning: |
    Golden shafts of light pierce the canopy, illuminating motes of dust
    that drift lazily through the air. The forest feels peaceful, almost
    welcoming.
  evening: |
    Long shadows stretch between the trunks as the sun sinks low. The
    whispering grows louder, and the air carries a chill that seeps into
    your bones.
  rainy: |
    Rain drums against the leaves in a steady rhythm, turning the forest
    floor into a maze of mud and hidden roots. The whispers are drowned
    out, replaced by the rush of water.
