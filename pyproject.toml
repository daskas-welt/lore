[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore"
version = "0.1.0"
description = "A read-aloud companion for Dungeon Masters — browse, search, and display ready-made descriptions at the table"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/user/lore"
Changelog = "https://github.com/user/lore/blob/main/CHANGELOG.md"
Issues = "https://github.com/user/lore/issues"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "textual-dev>=1.0.0",
]

[project.scripts]
lore = "lore.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
