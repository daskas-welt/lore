[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore"
version = "2.0.0"
description = "A TUI for Dungeon Masters to read aloud descriptions of areas, NPCs, and objects"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "textual-dev>=1.0.0",
]

[project.scripts]
lore = "lore.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
